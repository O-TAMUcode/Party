<!DOCTYPE html>
<!--
パーティーアイランド(1ファイル版)
- このファイルをブラウザで開くだけで遊べます。
- 公開: GitHubにこのファイルを index.html という名前でpush
  → Render の New+ > Static Site でそのリポジトリを選択
  → Build Command は空欄 / Publish Directory は「.」
-->

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パーティーアイランド</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:linear-gradient(160deg,#5ad1ff,#a78bfa 60%,#ff8fd0);color:#2b2350;user-select:none}
body{display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px;overflow-x:hidden}
.hide{display:none!important}
h1{margin:0;font-size:clamp(22px,5vw,34px);color:#fff;text-shadow:0 3px 0 #6b3fd0,0 6px 8px rgba(0,0,0,.25)}
.btn{font:inherit;font-weight:800;font-size:clamp(16px,3.6vw,22px);padding:.6em 1.2em;border:0;border-radius:999px;background:#ffd23f;color:#5a3b00;box-shadow:0 5px 0 #d69a00;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d69a00}
.btn.green{background:#5be17b;color:#06450f;box-shadow:0 5px 0 #28a647}
.btn.red{background:#ff6b81;color:#fff;box-shadow:0 5px 0 #c93a52}
.btn.big{font-size:clamp(24px,7vw,40px);padding:.9em 1.6em}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
/* setup */
#setup{margin-top:4vh;max-width:460px;width:100%;text-align:center}
#setup label{display:block;margin:14px 0 6px;font-weight:800}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{font:inherit;font-weight:800;border:3px solid #a78bfa;background:#fff;color:#6b3fd0;border-radius:12px;padding:8px 14px;cursor:pointer}
.seg button.on{background:#a78bfa;color:#fff}
/* game */
#game{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px;align-items:center}
#scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.sc{background:#fff;border-radius:12px;padding:5px 4px;text-align:center;font-weight:800;font-size:clamp(11px,2.8vw,15px);border:3px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.sc.cur{border-color:#ffd23f;transform:scale(1.05);background:#fffbe0}
.sc .em{font-size:clamp(20px,5vw,28px)}
#round{color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#board{--c:min(calc((100vw - 16px)/8),calc(640px/8));display:grid;grid-template-columns:repeat(8,var(--c));grid-template-rows:repeat(8,var(--c));gap:2px;background:#fff6;padding:4px;border-radius:16px}
.cell{border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--c)*.4);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.cell.B{background:#6cc8ff}.cell.R{background:#ff7b8b}.cell.E{background:#ffe066}.cell.S{background:#8be28b}
.cell .tk{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;font-size:calc(var(--c)*.34);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.cell .st{position:absolute;top:-4px;right:-2px;font-size:calc(var(--c)*.42);animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(-4px) rotate(10deg)}}
#center{grid-column:2/8;grid-row:2/8;background:#fffffff0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center;min-height:0;overflow:hidden}
#msg{font-weight:800;font-size:clamp(14px,3.6vw,20px);line-height:1.35}
#dice{font-size:clamp(40px,12vw,76px);line-height:1}
#actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#log{font-size:clamp(10px,2.4vw,13px);color:#6b6490;max-height:4.2em;overflow:hidden;line-height:1.4}
/* minigame */
#mg{position:fixed;inset:0;background:rgba(40,20,90,.85);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
#mgBox{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:440px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
#mgTitle{font-size:clamp(22px,6vw,30px);font-weight:900;color:#6b3fd0}
#mgDesc{margin:6px 0 14px;font-weight:700}
#mgBody{min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.big-num{font-size:64px;font-weight:900;color:#ff6b81}
.bar{position:relative;width:100%;height:46px;background:#ddd;border-radius:23px;overflow:hidden}
.bar .zone{position:absolute;left:45%;width:10%;top:0;bottom:0;background:#5be17b}
.bar .mk{position:absolute;top:0;bottom:0;width:8px;background:#ff3b5c;border-radius:4px;transform:translateX(-50%)}
.react{width:100%;height:150px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;background:#e24b4b;cursor:pointer}
.react.go{background:#2fcf5f}
table.res{width:100%;border-collapse:collapse;font-weight:800}
table.res td{padding:6px;border-bottom:2px dashed #ddd}
</style>
</head>
<body>
<h1>🏝️ パーティーアイランド</h1>

<div id="setup" class="card">
  <div style="font-size:15px;font-weight:700">サイコロをふって進み、コインを集めて⭐をゲットしよう!<br>ラウンドの終わりにはミニゲーム!</div>
  <label>あそぶ人数(のこりはCPU)</label>
  <div class="seg" id="segHumans"></div>
  <label>ラウンド数</label>
  <div class="seg" id="segRounds"></div>
  <div style="margin-top:20px"><button class="btn big green" id="startBtn">スタート!</button></div>
</div>

<div id="game" class="hide">
  <div id="round"></div>
  <div id="scores"></div>
  <div id="board"></div>
</div>

<div id="mg" class="hide"><div id="mgBox">
  <div id="mgTitle"></div><div id="mgDesc"></div><div id="mgBody"></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let ac;
function beep(f=600,d=.08,type='square'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const jingle=async(list)=>{for(const f of list){beep(f,.1,'triangle');await sleep(110);}};

/* ---------- setup ---------- */
const cfg={humans:1,rounds:10};
function seg(id,vals,key,fmt){
  const el=$(id);
  vals.forEach(v=>{const b=document.createElement('button');b.textContent=fmt(v);
    b.onclick=()=>{cfg[key]=v;[...el.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');};
    if(cfg[key]===v)b.classList.add('on');el.appendChild(b);});
}
seg('#segHumans',[1,2,3,4],'humans',v=>v+'人');
seg('#segRounds',[5,10,15],'rounds',v=>v+'ラウンド');

/* ---------- board ---------- */
const N=28;
const path=[];
for(let c=0;c<8;c++)path.push([0,c]);
for(let r=1;r<8;r++)path.push([r,7]);
for(let c=6;c>=0;c--)path.push([7,c]);
for(let r=6;r>=1;r--)path.push([r,0]);
const types=[...Array(N)].map((_,i)=>i%7===3?'E':i%7===5?'R':'B');
const ICON={B:'',R:'💀',E:'❓',S:''};
const STAR_COST=20;
const COLORS=['🐱','🐶','🐸','🐼'];
let players=[],starPos=0,turn=0,round=0;
const cellEls=[];

function buildBoard(){
  const b=$('#board');b.innerHTML='';cellEls.length=0;
  path.forEach(([r,c],i)=>{
    const d=document.createElement('div');
    d.className='cell '+types[i];
    d.style.gridRow=r+1;d.style.gridColumn=c+1;
    b.appendChild(d);cellEls.push(d);
  });
  const ctr=document.createElement('div');ctr.id='center';
  ctr.innerHTML='<div id="msg"></div><div id="dice"></div><div id="actions"></div><div id="log"></div>';
  b.appendChild(ctr);
}
function render(){
  cellEls.forEach((d,i)=>{
    const here=players.filter(p=>p.pos===i).map(p=>p.emoji).join('');
    d.innerHTML=(i===0?'🏁':ICON[types[i]])+(i===starPos?'<span class="st">⭐</span>':'')+(here?`<span class="tk">${here}</span>`:'');
  });
  $('#scores').innerHTML=players.map((p,i)=>`<div class="sc ${i===turn?'cur':''}"><div class="em">${p.emoji}</div>${p.name}<br>⭐${p.stars} 🪙${p.coins}</div>`).join('');
}
const msg=t=>{$('#msg').innerHTML=t};
const logs=[];
function log(t){logs.unshift(t);logs.length=3;$('#log').innerHTML=logs.join('<br>');}
function actions(buttons){
  return new Promise(res=>{
    const a=$('#actions');a.innerHTML='';
    buttons.forEach(([label,val,cls])=>{
      const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=label;
      b.onclick=()=>{a.innerHTML='';res(val);};a.appendChild(b);
    });
  });
}

/* ---------- game flow ---------- */
$('#startBtn').onclick=startGame;
function startGame(){
  beep(800);
  players=[...Array(4)].map((_,i)=>({
    name:i<cfg.humans?'P'+(i+1):'CPU'+(i-cfg.humans+1),
    emoji:COLORS[i],human:i<cfg.humans,coins:10,stars:0,pos:0
  }));
  starPos=rnd(4,N-1);
  $('#setup').classList.add('hide');$('#game').classList.remove('hide');
  buildBoard();render();
  mainLoop();
}

async function mainLoop(){
  for(round=1;round<=cfg.rounds;round++){
    $('#round').textContent=`ラウンド ${round} / ${cfg.rounds}`;
    for(turn=0;turn<players.length;turn++){render();await playTurn(players[turn]);}
    turn=-1;render();
    await minigameRound();
  }
  await finale();
}

async function playTurn(p){
  msg(`${p.emoji} <b>${p.name}</b> のばん`);
  if(p.human) await actions([['🎲 サイコロをふる',1]]); else await sleep(700);
  const n=await rollDice();
  log(`${p.emoji}${p.name} は ${n} がでた!`);
  await movePlayer(p,n);
  await land(p);
  await sleep(500);
}
async function rollDice(){
  const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  for(let i=0;i<12;i++){$('#dice').textContent=faces[rnd(0,5)];beep(300+i*30,.04);await sleep(60);}
  const n=rnd(1,6);$('#dice').textContent=faces[n-1];beep(900,.15);await sleep(350);
  return n;
}
async function movePlayer(p,steps){
  for(let i=0;i<steps;i++){
    p.pos=(p.pos+1)%N;render();beep(420+i*40,.06);await sleep(260);
    if(p.pos===starPos&&i<steps-1)await tryBuyStar(p);
  }
}
async function tryBuyStar(p){
  if(p.coins<STAR_COST)return;
  let yes=true;
  if(p.human){
    msg(`⭐ ${STAR_COST}コインで スターを買う?<br>(いま 🪙${p.coins})`);
    yes=await actions([['買う!',true,'green'],['やめる',false,'red']]);
  }else await sleep(500);
  if(!yes)return;
  p.coins-=STAR_COST;p.stars++;
  msg(`🌟 ${p.emoji}${p.name} が スターをゲット!!`);
  log(`🌟 ${p.name} がスターを手に入れた`);
  await jingle([523,659,784,1047]);
  let np;do{np=rnd(1,N-1);}while(np===starPos||np===p.pos);
  starPos=np;render();await sleep(900);
}
async function land(p){
  const t=types[p.pos];
  if(p.pos===starPos){await tryBuyStar(p);}
  if(t==='B'){p.coins+=3;msg(`🔵 コイン +3`);log(`${p.name}: +3コイン`);await jingle([700,900]);}
  else if(t==='R'){const l=Math.min(3,p.coins);p.coins-=l;msg(`💀 コイン -3`);log(`${p.name}: -3コイン`);await jingle([300,200]);}
  else if(t==='E'){await event(p);}
  render();await sleep(600);
}
async function event(p){
  const others=players.filter(x=>x!==p);
  const evs=[
    ()=>{p.coins+=5;return '🪙 コインをひろった! +5';},
    ()=>{const l=Math.min(5,p.coins);p.coins-=l;return '🕳️ おとしあなに落ちた! -5';},
    ()=>{p.coins+=10;return '🍀 ラッキー!! +10';},
    ()=>{const v=others[rnd(0,others.length-1)];const t=Math.min(5,v.coins);v.coins-=t;p.coins+=t;return `🦹 コインどろぼう! ${v.emoji}${v.name}から${t}枚うばった`;},
    ()=>{let s=0;others.forEach(o=>{const g=Math.min(3,p.coins);p.coins-=g;o.coins+=g;s+=g;});return `🎁 みんなにコインを配った(-${s})`;},
    ()=>{const v=others[rnd(0,others.length-1)];const t=Math.min(3,v.coins);v.coins-=t;p.coins+=t;return `🎈 ${v.emoji}${v.name}がコインを${t}枚おとした!ぜんぶもらった`;},
    ()=>{players.forEach(x=>x.coins+=2);return '🎉 みんなに +2コイン!';}
  ];
  const text=evs[rnd(0,evs.length-1)]();
  msg('❓ イベント!<br>'+text);log(text);beep(500);await jingle([600,500,700]);render();await sleep(900);
}

/* ---------- minigames ---------- */
function mgShow(title,desc){$('#mg').classList.remove('hide');$('#mgTitle').textContent=title;$('#mgDesc').textContent=desc;$('#mgBody').innerHTML='';}
function mgHide(){$('#mg').classList.add('hide');}
function mgButton(label,cls=''){return new Promise(res=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=()=>{b.remove();res();};$('#mgBody').appendChild(b);});}
async function countdown(){
  const body=$('#mgBody');body.innerHTML='';
  for(const n of ['3','2','1','GO!']){body.innerHTML=`<div class="big-num">${n}</div>`;beep(n==='GO!'?900:500,.15);await sleep(700);}
  body.innerHTML='';
}

const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function choices(opts,cls){
  return new Promise(res=>{
    const w=document.createElement('div');
    w.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%';
    opts.forEach(o=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=o;
      b.onpointerdown=e=>{e.preventDefault();w.remove();res(o);};w.appendChild(b);});
    $('#mgBody').appendChild(w);
  });
}
const GAMES=[
 {title:'🔨 ボタンれんだ!',desc:'5びょうで いっぱいタップ!',unit:'回',
  cpu:()=>rnd(22,48),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    return new Promise(res=>{
      let n=0,left=5;const body=$('#mgBody');
      body.innerHTML=`<div id="t" style="font-weight:900;font-size:24px">のこり ${left}</div><button class="btn big red" id="tap">タップ!! 0</button>`;
      const tap=$('#tap');tap.onpointerdown=e=>{e.preventDefault();n++;tap.textContent='タップ!! '+n;beep(500+n*5,.03);};
      const iv=setInterval(()=>{left--;$('#t').textContent='のこり '+left;if(left<=0){clearInterval(iv);res(n);}},1000);
    });
  }},
 {title:'🎯 ピタッととめろ!',desc:'赤い線を 緑のゾーンで止めよう!',unit:'点',
  cpu:()=>rnd(40,98),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');
    const body=$('#mgBody');
    body.innerHTML='<div class="bar"><div class="zone"></div><div class="mk" id="mk"></div></div><button class="btn big red" id="stop">ストップ!</button>';
    const mk=$('#mk');const t0=performance.now();const speed=.0042+Math.random()*.002;let pct=50,raf;
    const loop=()=>{pct=50+50*Math.sin((performance.now()-t0)*speed*2);mk.style.left=pct+'%';raf=requestAnimationFrame(loop);};loop();
    return new Promise(res=>{$('#stop').onpointerdown=e=>{e.preventDefault();cancelAnimationFrame(raf);beep(800,.1);res(Math.round(100-Math.abs(pct-50)*2));};});
  }},
 {title:'⚡ はんしゃしんけい',desc:'緑になったら すぐタップ! はやいほど高得点',unit:'点',
  cpu:()=>1000-rnd(260,650),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');
    const body=$('#mgBody');body.innerHTML='<div class="react" id="rc">まって…</div>';
    const rc=$('#rc');
    return new Promise(res=>{
      let go=false,t0=0,done=false;
      const timer=setTimeout(()=>{go=true;t0=performance.now();rc.classList.add('go');rc.textContent='いま!!';beep(1000,.12);},rnd(1500,4000));
      rc.onpointerdown=e=>{e.preventDefault();if(done)return;done=true;
        if(!go){clearTimeout(timer);rc.textContent='はやすぎ!';res(0);}
        else res(Math.max(0,Math.round(1000-(performance.now()-t0))));};
    });
  }},
 {title:'🧮 けいさんバトル',desc:'5もん! はやく正しくこたえよう',unit:'点',
  cpu:()=>rnd(300,800),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    let score=0;
    for(let q=1;q<=5;q++){
      let a,b,ans,txt;
      if(Math.random()<.5){a=rnd(10,60);b=rnd(10,40);ans=a+b;txt=`${a} + ${b}`;}
      else{a=rnd(3,12);b=rnd(3,12);ans=a*b;txt=`${a} × ${b}`;}
      const opts=new Set([ans]);
      while(opts.size<4){const d=rnd(1,6)*(Math.random()<.5?-1:1);if(ans+d>0)opts.add(ans+d);}
      $('#mgBody').innerHTML=`<div style="font-weight:800">${q} / 5</div><div style="font-size:48px;font-weight:900">${txt} = ?</div>`;
      const t0=performance.now();
      const pick=await choices(shuf([...opts]));
      const dt=performance.now()-t0;
      if(pick===ans){score+=Math.max(20,Math.round(200-dt/30));beep(900,.1);}else beep(200,.2);
    }
    return score;
  }},
 {title:'🎨 いろあてクイズ',desc:'文字の「いろ」をこたえてね(文字の意味にだまされるな!)',unit:'点',
  cpu:()=>rnd(350,850),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    const C=[['あか','#e53935'],['あお','#1e88e5'],['みどり','#43a047'],['きいろ','#f9a825']];
    let ok=0;const T0=performance.now();
    for(let q=1;q<=6;q++){
      const w=rnd(0,3);let i;do{i=rnd(0,3);}while(i===w);
      $('#mgBody').innerHTML=`<div style="font-weight:800">${q} / 6 ・ 文字の いろは?</div><div style="font-size:64px;font-weight:900;color:${C[i][1]};text-shadow:0 0 2px #0003">${C[w][0]}</div>`;
      const pick=await choices(C.map(c=>c[0]));
      if(pick===C[i][0]){ok++;beep(900,.1);}else beep(200,.2);
    }
    const T=performance.now()-T0;
    return ok*100+Math.max(0,Math.round(300-T/60));
  }},
 {title:'🐹 もぐらたたき',desc:'もぐら🐹をタップ! 💣はNG!(8びょう)',unit:'点',
  cpu:()=>rnd(40,100),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    const body=$('#mgBody');
    body.innerHTML='<div id="sc" style="font-weight:900;font-size:22px">0点</div><div id="holes" style="display:grid;grid-template-columns:repeat(3,84px);gap:10px"></div>';
    const holes=[...Array(9)].map(()=>{const h=document.createElement('div');
      h.style.cssText='height:84px;border-radius:50%;background:#7a5230;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:inset 0 6px 0 rgba(0,0,0,.35)';
      $('#holes').appendChild(h);return h;});
    let score=0,active=-1,kind='',last=-1;
    const clear=()=>{if(active>=0)holes[active].textContent='';active=-1;};
    holes.forEach((h,i)=>{h.onpointerdown=e=>{e.preventDefault();if(i!==active)return;
      if(kind==='m'){score+=10;beep(900,.06);}else{score-=20;beep(180,.2);}
      h.textContent=kind==='m'?'💥':'😵';active=-1;$('#sc').textContent=score+'点';};});
    const iv=setInterval(()=>{clear();let n;do{n=rnd(0,8);}while(n===last);last=n;
      kind=Math.random()<.2?'b':'m';active=n;holes[n].textContent=kind==='m'?'🐹':'💣';},700);
    await sleep(8000);clearInterval(iv);clear();
    return Math.max(0,score);
  }},
 {title:'🔢 すうじタッチ',desc:'1から9まで じゅんばんにタッチ! はやいほど高得点',unit:'点',
  cpu:()=>rnd(100,220),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    const body=$('#mgBody');
    body.innerHTML='<div id="nx" style="font-weight:900;font-size:22px">つぎは 1</div><div id="grid" style="display:grid;grid-template-columns:repeat(3,80px);gap:10px"></div>';
    return new Promise(res=>{
      let next=1;const t0=performance.now();
      shuf([1,2,3,4,5,6,7,8,9]).forEach(n=>{
        const b=document.createElement('button');b.className='btn';b.textContent=n;b.style.cssText='height:80px;font-size:32px;padding:0';
        b.onpointerdown=e=>{e.preventDefault();if(n!==next){beep(200,.1);return;}
          beep(500+n*60,.06);b.style.visibility='hidden';next++;
          if(next>9)res(Math.max(0,Math.round(300-(performance.now()-t0)/50)));
          else $('#nx').textContent='つぎは '+next;};
        $('#grid').appendChild(b);
      });
    });
  }},
 {title:'🧠 きおくゲーム',desc:'光ったじゅんばんを おぼえて まねしよう!',unit:'点',
  cpu:()=>rnd(2,6)*100,
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');
    const body=$('#mgBody');
    const cols=['#ff6b81','#4da3ff','#5be17b','#ffd23f'],fr=[330,440,550,660];
    body.innerHTML='<div id="info" style="font-weight:800">みてて!</div><div id="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:230px"></div>';
    const btns=cols.map(c=>{const b=document.createElement('button');
      b.style.cssText=`height:90px;border:0;border-radius:18px;background:${c};opacity:.5;transition:opacity .1s`;
      $('#pad').appendChild(b);return b;});
    const flash=async i=>{btns[i].style.opacity=1;beep(fr[i],.25,'triangle');await sleep(350);btns[i].style.opacity=.5;await sleep(130);};
    const seq=[];let cleared=0;
    while(cleared<8){
      seq.push(rnd(0,3));
      $('#info').textContent='みてて!';await sleep(600);
      for(const i of seq)await flash(i);
      $('#info').textContent='まねしてね!';
      const ok=await new Promise(res=>{
        let k=0;
        const off=()=>btns.forEach(x=>x.onpointerdown=null);
        btns.forEach((b,i)=>{b.onpointerdown=e=>{e.preventDefault();
          b.style.opacity=1;beep(fr[i],.15,'triangle');setTimeout(()=>b.style.opacity=.5,160);
          if(i!==seq[k]){off();beep(180,.3);res(false);return;}
          k++;if(k===seq.length){off();res(true);}};});
      });
      if(!ok)break;cleared++;await sleep(300);
    }
    return cleared*100;
  }},
 {title:'🍎 かぞえてゲーム',desc:'🍎は なんこ? 3もん! はやく正しくこたえよう',unit:'点',
  cpu:()=>rnd(150,500),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    let score=0;
    for(let q=1;q<=3;q++){
      const n=rnd(4,12),others=rnd(8,14);
      const items=shuf([...Array(n).fill('🍎'),...[...Array(others)].map(()=>['🍌','🍇','🍊'][rnd(0,2)])]);
      $('#mgBody').innerHTML=`<div style="font-weight:800">${q} / 3 ・ 🍎は なんこ?</div><div style="font-size:34px;line-height:1.3;max-width:320px">${items.join('')}</div>`;
      const opts=new Set([n]);while(opts.size<4){const d=rnd(1,3)*(Math.random()<.5?-1:1);if(n+d>0)opts.add(n+d);}
      const t0=performance.now();
      const pick=await choices(shuf([...opts]));
      const dt=performance.now()-t0;
      if(pick===n){score+=Math.max(40,Math.round(200-dt/40));beep(900,.1);}else beep(200,.2);
    }
    return score;
  }},
 {title:'👐 左右こうごれんだ',desc:'ひだり・みぎ こうごにタップ! おなじ側のれんぞくは数えないよ(6びょう)',unit:'回',
  cpu:()=>rnd(18,40),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    $('#mgBody').innerHTML='<div id="t" style="font-weight:900;font-size:22px"></div><div style="display:flex;gap:12px"><button class="btn big" id="bl" style="padding:.7em 1.1em">◀</button><button class="btn big red" id="br" style="padding:.7em 1.1em">▶</button></div>';
    return new Promise(res=>{
      let n=0,last='',left=6;
      const upd=()=>{$('#t').textContent=`のこり ${left} ・ ${n}回`;};upd();
      const hit=s=>e=>{e.preventDefault();if(s===last){beep(180,.03);return;}last=s;n++;beep(s==='L'?420:620,.03);upd();};
      $('#bl').onpointerdown=hit('L');$('#br').onpointerdown=hit('R');
      const iv=setInterval(()=>{left--;upd();if(left<=0){clearInterval(iv);res(n);}},1000);
    });
  }},
 {title:'🚴 ダッシュれんだ',desc:'れんだでスピードをあげて ながくはしろう!(7びょう)',unit:'m',
  cpu:()=>rnd(70,140),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    $('#mgBody').innerHTML='<div id="t" style="font-weight:900;font-size:22px"></div><div class="bar" style="height:30px"><div id="sp" style="position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#5be17b,#ffd23f,#ff6b81)"></div></div><button class="btn big green" id="go">🚴 れんだ!!</button>';
    return new Promise(res=>{
      let speed=0,dist=0,ticks=0;
      $('#go').onpointerdown=e=>{e.preventDefault();speed=Math.min(20,speed+1.2);beep(300+speed*20,.03);};
      const iv=setInterval(()=>{
        ticks++;speed=speed*0.9;dist+=speed*0.2;
        $('#sp').style.width=(speed/20*100)+'%';
        $('#t').textContent=`のこり ${Math.max(0,7-Math.floor(ticks/10))} ・ ${Math.round(dist)}m`;
        if(ticks>=70){clearInterval(iv);res(Math.round(dist));}
      },100);
    });
  }},
 {title:'🧱 ブロックくずし',desc:'れんだでブロックをこわせ! だんだんカタくなるよ(8びょう)',unit:'点',
  cpu:()=>rnd(35,70),
  async play(p){
    await mgButton(`${p.emoji} ${p.name} スタート!`,'green');await countdown();
    $('#mgBody').innerHTML='<div id="t" style="font-weight:900;font-size:22px"></div><div id="blk" style="font-size:72px;line-height:1">🧱</div><div class="bar" style="height:22px"><div id="hp" style="position:absolute;left:0;top:0;bottom:0;width:100%;background:#ff6b81"></div></div><button class="btn big red" id="hit">👊 パンチ!!</button>';
    return new Promise(res=>{
      let broken=0,max=5,hp=5,left=8;
      const upd=()=>{$('#t').textContent=`のこり ${left} ・ ${broken}こ`;$('#hp').style.width=(hp/max*100)+'%';};upd();
      $('#hit').onpointerdown=e=>{e.preventDefault();hp--;beep(250+hp*30,.03);
        if(hp<=0){broken++;max=5+broken*2;hp=max;beep(900,.12);
          $('#blk').textContent='💥';setTimeout(()=>{$('#blk').textContent='🧱';},120);}
        upd();};
      const iv=setInterval(()=>{left--;upd();if(left<=0){clearInterval(iv);
        res(broken*10+Math.floor((1-hp/max)*10));}},1000);
    });
  }}
];

let lastG=-1;
async function minigameRound(){
  let gi;do{gi=rnd(0,GAMES.length-1);}while(gi===lastG&&GAMES.length>1);lastG=gi;const g=GAMES[gi];
  mgShow(g.title,g.desc);
  await mgButton('ミニゲームスタート!','green');
  const scores=[];
  for(const p of players){
    if(p.human){mgShow(g.title,g.desc);scores.push(await g.play(p));
      $('#mgBody').innerHTML=`<div class="big-num" style="color:#6b3fd0">${scores[scores.length-1]}${g.unit}</div>`;await sleep(900);}
    else scores.push(g.cpu());
  }
  const order=players.map((p,i)=>({p,s:scores[i]})).sort((a,b)=>b.s-a.s);
  const REW=[10,6,3,0];
  order.forEach((o,i)=>o.p.coins+=REW[i]);
  mgShow('🏆 けっか',g.title);
  $('#mgBody').innerHTML='<table class="res">'+order.map((o,i)=>`<tr><td>${['🥇','🥈','🥉','4'][i]}</td><td>${o.p.emoji} ${o.p.name}</td><td>${o.s}${g.unit}</td><td>🪙+${REW[i]}</td></tr>`).join('')+'</table>';
  await jingle([523,659,784]);
  await mgButton('つぎへ','green');
  mgHide();turn=0;render();
}

/* ---------- finale ---------- */
async function finale(){
  const order=[...players].sort((a,b)=>b.stars-a.stars||b.coins-a.coins);
  mgShow('🎉 けっかはっぴょう!','⭐の数 → コインの数 で順位が決まるよ');
  $('#mgBody').innerHTML='<table class="res">'+order.map((p,i)=>`<tr><td>${['👑','🥈','🥉','4'][i]}</td><td>${p.emoji} ${p.name}</td><td>⭐${p.stars}</td><td>🪙${p.coins}</td></tr>`).join('')+'</table>';
  await jingle([523,659,784,1047,784,1047,1319]);
  await mgButton('もういちど あそぶ','green');
  location.reload();
}
